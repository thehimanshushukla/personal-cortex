name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest==8.3.5
      - run: python3 -m pytest tests -q
      - run: cd examples && python3 -m unittest -q test_examples.py
      - run: python3 -m pytest plugins/cortex/tests -q
      - run: python3 -m pytest connector/tests -q
  mac-system-python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m compileall -q plugins/cortex/scripts

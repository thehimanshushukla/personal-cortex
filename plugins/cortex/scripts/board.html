<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex board</title>
<style>
/* Three themes: Paper, Blue, Night. No choice saved = follows the Mac. */
@font-face { font-family: Geist; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/geist.woff2) format("woff2"); }
:root, :root[data-theme="paper"] {
  --paper: #faf9f5; --paper-2: #f3f1ea; --ink: #1d1c18; --ink-2: #3d3b35; --faint: #716e65; --muted-ink: #5f5c54;
  --line: #e7e4da; --line-2: #efece4; --accent-strong: #d4552b; --surface: #ffffff; --shade: 20,16,8; --hi: rgba(255,255,255,.75);
  --ember: #b2441f; --ember-tint: rgba(212,85,43,.10); --ok: #2f7d58; --sky: #2860c4; --violet: #7a5af0; --amber: #c08a12;
  --glass-bg: rgba(255,255,255,.66); --glass-border: rgba(29,28,24,.08); --btn: #1d1c18; --btn-ink: #faf9f5; --mesh: none;
}
:root[data-theme="blue"] {
  --paper: #f8fafc; --paper-2: #f1f5f9; --ink: #0f172a; --ink-2: #334155; --faint: #64748b; --muted-ink: #4f5d73;
  --line: #e2e8f0; --line-2: #edf1f6; --accent-strong: #3b82f6; --surface: #ffffff; --shade: 15,23,42; --hi: rgba(255,255,255,.75);
  --ember: #b2441f; --ember-tint: rgba(212,85,43,.10); --ok: #2f7d58; --sky: #2860c4; --violet: #7a5af0; --amber: #c08a12;
  --glass-bg: rgba(255,255,255,.62); --glass-border: rgba(15,23,42,.07); --btn: #2f6bd8; --btn-ink: #ffffff;
  --mesh: radial-gradient(ellipse at 20% 50%, rgba(59,130,246,.04) 0%, transparent 50%), radial-gradient(ellipse at 80% 20%, rgba(139,92,246,.03) 0%, transparent 50%), radial-gradient(ellipse at 40% 80%, rgba(6,182,212,.02) 0%, transparent 50%);
}
:root[data-theme="night"] {
  color-scheme: dark;
  --paper: #111114; --paper-2: #18181c; --ink: #f2f0ea; --ink-2: #d6d3cb; --faint: #8f8c84; --muted-ink: #a29f97;
  --line: #2a2a30; --line-2: #26262c; --accent-strong: #ff7d4f; --surface: #1c1c22; --shade: 0,0,0; --hi: rgba(255,255,255,.08);
  --ember: #ff7d4f; --ember-tint: rgba(255,125,79,.13); --ok: #4cc38a; --sky: #78a9ff; --violet: #a08cff; --amber: #e0b04a;
  --glass-bg: rgba(28,28,34,.62); --glass-border: rgba(255,255,255,.08); --btn: #f2f0ea; --btn-ink: #111114; --mesh: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 17px/1.5 Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-image: var(--mesh); min-height: 100vh;
  transition: background-color .4s cubic-bezier(.22,1,.36,1), color .4s cubic-bezier(.22,1,.36,1); }
header { padding: 18px 20px 10px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
h1 { font-size: 26px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
.tabs, .themes { display: inline-flex; flex-wrap: wrap; max-width: 100%; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; }
.themes { margin-left: auto; }
.tabs button, .themes button { font: inherit; font-size: 16px; border: 0; border-radius: 9px; background: transparent; color: var(--muted-ink);
  padding: 6px 14px; min-height: 38px; cursor: pointer; }
.tabs button:hover, .themes button:hover { color: var(--ink); }
.tabs button[aria-selected="true"], .themes button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
select { max-width: 100%; min-width: 0; }
.btn, select { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; min-height: 44px; cursor: pointer; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 0 20px 14px; }
.bar label { color: var(--muted-ink); font-size: 16px; display: flex; gap: 8px; align-items: center; min-width: 0; max-width: 100%; }
#msg { margin: 0 20px 12px; padding: 12px 16px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
  background: color-mix(in srgb, var(--amber) 11%, transparent); color: var(--ink); display: none; }
#msg.show { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#msg.good { border-color: color-mix(in srgb, var(--ok) 30%, transparent); background: color-mix(in srgb, var(--ok) 11%, transparent); }
#msg.note { border-color: var(--line); background: var(--paper-2); }
.problems { margin: 0 20px 12px; padding: 12px 16px; border-radius: 10px; background: var(--ember-tint); color: var(--ember); }
.problems ul { margin: 6px 0 0; padding-left: 20px; }
main { padding: 0 20px 40px; }
.board { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(215px, 100%), 1fr)); align-items: start; }
.glass, .col, .card, .inbox section { background: var(--glass-bg); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--hi), 0 1px 3px rgba(var(--shade),.05), 0 1px 2px rgba(var(--shade),.03); }
.col { border-radius: 12px; padding: 12px; min-height: 200px; border-top: 4px solid var(--faint); transition: background-color .2s, box-shadow .2s; }
.col.overdue { border-top-color: var(--ember); }
.col.week { border-top-color: var(--amber); }
.col.later { border-top-color: var(--faint); }
.col.doing { border-top-color: var(--sky); }
.col.waiting { border-top-color: var(--violet); }
.col.done { border-top-color: var(--ok); }
.col h2 { font-size: 16px; font-weight: 600; color: var(--ink-2); margin: 2px 4px 10px; display: flex; justify-content: space-between; align-items: center; }
.col h2 .n { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px;
  background: var(--paper-2); color: var(--muted-ink); font-size: 13px; font-weight: 600; }
.col.over { box-shadow: 0 0 0 2px var(--accent-strong); background: color-mix(in srgb, var(--accent-strong) 7%, var(--glass-bg)); }
.col.nodrop.over { box-shadow: 0 0 0 2px var(--ember); background: var(--ember-tint); }
.col .hint { color: var(--muted-ink); font-size: 14px; margin: 0 4px 8px; }
.col.overdue h2 { color: var(--ember); }
.col.overdue h2 .n { background: var(--ember-tint); color: var(--ember); }
.empty { color: var(--faint); font-size: 15px; padding: 16px 8px; margin: 0; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
.card { border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
.card:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 var(--hi), 0 8px 25px rgba(var(--shade),.09), 0 2px 6px rgba(var(--shade),.05);
  border-color: color-mix(in srgb, var(--glass-border) 100%, var(--ink) 6%); }
.card.dragging { opacity: .5; }
.card .text { font-size: 16px; font-weight: 500; color: var(--ink-2); line-height: 1.4; margin: 0 0 8px; overflow-wrap: anywhere; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--muted-ink); margin-bottom: 8px; align-items: center; }
.chip { background: var(--paper-2); border: 1px solid var(--line); color: var(--ink-2); border-radius: 999px; padding: 1px 9px; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.chip.late { background: var(--ember-tint); border-color: transparent; color: var(--ember); font-weight: 600; }
.chip.doing { background: color-mix(in srgb, var(--sky) 11%, transparent); border-color: transparent; color: var(--sky); }
.card select { width: 100%; font-size: 15px; min-height: 40px; padding: 6px 10px; }
.inbox section { border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.inbox h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
.inbox .why { color: var(--muted-ink); font-size: 15px; margin: 0 0 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--line-2); padding: 10px 0; }
.row .what { flex: 1 1 260px; overflow-wrap: anywhere; }
.row .path { color: var(--muted-ink); font-size: 14px; display: block; }
.row .acts { display: flex; gap: 8px; flex-wrap: wrap; }
#drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -6px 0 24px rgba(var(--shade),.14); padding: 18px 20px 30px; overflow-y: auto; display: none; z-index: 10; }
#drawer.open { display: block; }
#drawer:focus { outline: none; }
#drawer h2 { font-size: 21px; font-weight: 600; margin: 0 76px 6px 0; overflow-wrap: anywhere; }
#drawer .close { position: absolute; top: 14px; right: 14px; }
#drawer .line { font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--paper-2);
  border-radius: 8px; padding: 10px; overflow-wrap: anywhere; white-space: pre-wrap; }
#drawer dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 15px; }
#drawer dt { color: var(--muted-ink); }
#drawer dd { margin: 0; overflow-wrap: anywhere; }
#drawer .acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
#drawer pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.5 ui-monospace, Menlo, monospace;
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
#shade { position: fixed; inset: 0; background: rgba(0,0,0,.28); display: none; z-index: 9; }
#shade.open { display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 600px) { body { font-size: 16px; } header, .bar, main { padding-left: 12px; padding-right: 12px; }
  .themes { margin-left: 0; } #msg, .problems { margin-left: 12px; margin-right: 12px; } }
@media (prefers-reduced-motion: reduce) { body, .col, .card { transition: none; } .card:hover { transform: none; } }
</style>
<script>
// Before first paint, so a dark Mac never flashes a light page. The server puts the saved choice on <html>.
(function () {
  var r = document.documentElement, c = r.getAttribute("data-choice");
  r.setAttribute("data-theme", c === "paper" || c === "blue" || c === "night" ? c
    : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "paper"));
})();
</script>
</head>
<body>
<header>
  <h1>Your board</h1>
  <div class="tabs" role="tablist">
    <button id="tab-board" role="tab" aria-selected="true" aria-controls="board-view">Board</button>
    <button id="tab-inbox" role="tab" aria-selected="false" aria-controls="inbox-view">Inbox</button>
  </div>
  <div class="themes" role="group" aria-label="Theme">
    <button data-theme-choice="paper">Paper</button>
    <button data-theme-choice="blue">Blue</button>
    <button data-theme-choice="night">Night</button>
    <button data-theme-choice="system">System</button>
  </div>
</header>
<div class="bar">
  <label id="f-area-l">Area <select id="f-area"><option value="">All areas</option></select></label>
  <label id="f-person-l">Person <select id="f-person"><option value="">Everyone</option></select></label>
  <button class="btn" id="refresh">Refresh</button>
  <button class="btn" id="undo">Undo last change</button>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<div id="problems"></div>
<main>
  <div id="board-view" role="tabpanel" aria-labelledby="tab-board"><div class="board" id="board"></div></div>
  <div id="inbox-view" role="tabpanel" aria-labelledby="tab-inbox" class="inbox" hidden></div>
</main>
<div id="shade"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" tabindex="-1"></aside>
<script>
(function () {
  "use strict";
  // Every piece of text from the cortex goes through textContent; the page never builds HTML from strings.
  var state = null, current = null, lastFocus = null, dragId = null;
  var filters = { area: "", person: "" };
  try { if (location.search) history.replaceState(null, "", "/"); } catch (e) {}

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "cls") n.className = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function $(id) { return document.getElementById(id); }

  // Saved by the server, not the browser: the board gets a new address each time it starts, and browser storage would forget.
  function themeButtons(choice) {
    document.querySelectorAll("[data-theme-choice]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-choice") === choice));
    });
  }
  function setTheme(choice) {
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", choice === "system" ? (dark ? "night" : "paper") : choice);
    themeButtons(choice);
    themeChoice = choice;
    api("POST", "/api/theme", { theme: choice }).then(function (r) {
      if (r.status === 0) { say(r.message); clearTimeout(say.t); }
      else if (r.status !== 200) say("Could not save that look, so it lasts only until this page reloads.");
    });
  }
  var themeChoice = document.documentElement.getAttribute("data-choice") || "system";
  themeButtons(themeChoice);
  if (window.matchMedia) {
    var darkMac = matchMedia("(prefers-color-scheme: dark)");
    if (darkMac.addEventListener) darkMac.addEventListener("change", function (e) {
      if (themeChoice === "system") document.documentElement.setAttribute("data-theme", e.matches ? "night" : "paper");
    });
  }
  document.querySelectorAll("[data-theme-choice]").forEach(function (b) {
    b.addEventListener("click", function () { setTheme(b.getAttribute("data-theme-choice")); });
  });

  // tone: true = success (green), "note" = saved with something to know (neutral), else a warning.
  function say(text, good, undo) {
    var m = $("msg");
    m.textContent = "";
    m.className = "show" + (good === "note" ? " note" : good ? " good" : "");
    m.appendChild(el("span", { text: text }));
    if (undo) m.appendChild(el("button", { cls: "btn", text: "Undo", onclick: doUndo }));
    clearTimeout(say.t);
    say.t = setTimeout(function () { m.className = ""; }, good ? 6000 : 12000);
  }

  function api(method, path, body) {
    var opts = { method: method, headers: {}, credentials: "same-origin" };
    if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return { ok: false, message: "could not read the answer from the board." }; })
        .then(function (j) { j.status = r.status; return j; });
    }, function () { return { ok: false, status: 0, message: "This board has closed. Say 'show my board' to open it again. It closes by itself after 30 minutes without use." }; });
  }

  function load(note) {
    return api("GET", "/api/state").then(function (s) {
      // No answer at all means the board stopped, not that a page is broken. Keep the note up: nothing works until it is reopened.
      if (s.status === 0 || s.status === 403) { showProblems([]); say(s.message || "This board link has expired. Say 'show my board' to open it again."); clearTimeout(say.t); return false; }
      if (s.status !== 200 || !Array.isArray(s.items)) { showProblems([s.message || "could not read your cortex."]); return false; }
      state = s;
      fillFilters();
      showProblems(s.problems || []);
      render();
      if (note) say(note, false);
      return true;
    });
  }

  function showProblems(list) {
    var box = $("problems");
    box.textContent = "";
    if (!list.length) return;
    var ul = el("ul");
    list.forEach(function (p) { ul.appendChild(el("li", { text: p })); });
    box.appendChild(el("div", { cls: "problems" }, [el("strong", { text: "Some of your cortex could not be read:" }), ul]));
  }

  function fillFilters() {
    [["f-area", "area", "All areas"], ["f-person", "person", "Everyone"]].forEach(function (f) {
      var sel = $(f[0]), seen = {};
      state.items.forEach(function (i) { var v = f[1] === "person" ? i.person : i.area; if (v) seen[v] = 1; });
      sel.textContent = "";
      sel.appendChild(el("option", { value: "", text: f[2] }));
      Object.keys(seen).sort().forEach(function (v) {
        sel.appendChild(el("option", { value: v, text: f[1] === "person" ? "@" + v : v }));
      });
      if (!seen[filters[f[1]]]) filters[f[1]] = "";
      sel.value = filters[f[1]];
    });
  }

  function niceDate(iso) {
    var d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }

  function cardFor(i) {
    var meta = el("div", { cls: "meta" });
    meta.appendChild(el("span", { cls: "chip", text: i.mine ? "My to-do" : (i.owner === "theirs" ? "@" + i.person + " owes me" : "I owe @" + i.person) }));
    if (i.column === "overdue") meta.appendChild(el("span", { cls: "chip late", text: i.days_late + (i.days_late === 1 ? " day late" : " days late") }));
    else if (i.column === "done" && i.done) meta.appendChild(el("span", { text: "done " + niceDate(i.done) }));
    else if (i.due) meta.appendChild(el("span", { text: "due " + niceDate(i.due) }));
    if (i.doing && i.column !== "doing") meta.appendChild(el("span", { cls: "chip doing", text: "in progress" }));
    meta.appendChild(el("span", { text: i.page_title }));
    var sel = el("select", { "aria-label": "Move to" });
    sel.appendChild(el("option", { value: "", text: "Move to..." }));
    state.columns.forEach(function (c) {
      if (c.droppable && c.key !== i.column) sel.appendChild(el("option", { value: c.key, text: c.title }));
    });
    var card = el("div", { cls: "card", tabindex: "0", draggable: "true", role: "button", "data-id": i.id,
      "aria-label": (i.text || i.line) + ". Press Enter for details." }, [
      el("p", { cls: "text", text: i.text || i.line }), meta, sel]);
    // A select inside a draggable card: switch dragging off while it is in use, so a tap or
    // click on the menu never starts (or cancels) a drag.
    ["pointerdown", "mousedown", "touchstart", "focus"].forEach(function (ev) {
      sel.addEventListener(ev, function (e) { e.stopPropagation(); card.draggable = false; }, { passive: true });
    });
    sel.addEventListener("blur", function () { card.draggable = true; });
    sel.addEventListener("click", function (e) { e.stopPropagation(); });
    sel.addEventListener("keydown", function (e) { e.stopPropagation(); });
    sel.addEventListener("change", function () { if (sel.value) move(i, sel.value); });
    card.addEventListener("click", function () { openDrawer(i); });
    card.addEventListener("keydown", function (e) {
      if (e.target === card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDrawer(i); }
    });
    card.addEventListener("dragstart", function (e) {
      dragId = i.id; card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", i.id); } catch (x) {}
    });
    card.addEventListener("dragend", function () { card.classList.remove("dragging"); dragId = null; });
    return card;
  }

  function visible(i) {
    return (!filters.area || i.area === filters.area) && (!filters.person || i.person === filters.person);
  }

  function render() {
    var board = $("board");
    board.textContent = "";
    if (!state.ok) {
      board.appendChild(el("p", { cls: "empty", text: "The board could not be shown. See the message above." }));
      return;
    }
    state.columns.forEach(function (c) {
      var items = state.items.filter(function (i) { return i.column === c.key && visible(i); });
      var col = el("section", { cls: "col " + c.key + (c.droppable ? "" : " nodrop"), "aria-label": c.title }, [
        el("h2", {}, [el("span", { text: c.title }), el("span", { cls: "n", text: String(items.length) })])]);
      if (!c.droppable) col.appendChild(el("p", { cls: "hint", text: "Worked out from the date. Move a card to This week or Later to change it." }));
      if (!items.length) col.appendChild(el("p", { cls: "empty", text: c.key === "overdue" ? "Nothing overdue." : "Nothing here." }));
      items.forEach(function (i) { col.appendChild(cardFor(i)); });
      col.addEventListener("dragover", function (e) {
        if (!dragId) return;
        col.classList.add("over");
        // Overdue takes the drop too, only to explain why nothing moved.
        e.preventDefault(); e.dataTransfer.dropEffect = "move";
      });
      col.addEventListener("dragleave", function (e) { if (!col.contains(e.relatedTarget)) col.classList.remove("over"); });
      col.addEventListener("drop", function (e) {
        e.preventDefault(); col.classList.remove("over");
        var it = state.items.filter(function (x) { return x.id === dragId; })[0];
        if (it && it.column !== c.key) move(it, c.key);
      });
      board.appendChild(col);
    });
    if (!state.items.length && !(state.problems || []).length) {
      say("Nothing open yet. Lines like '- [ ] @me book the room {mine}' on your pages show up here.", true);
    }
    renderInbox();
  }

  function move(i, to) {
    var col = state.columns.filter(function (c) { return c.key === to; })[0];
    if (to === "overdue") { say("Overdue comes from the date. Move it to This week or Later to change the date."); return; }
    api("POST", "/api/move", { id: i.id, sha: i.sha, to: to }).then(function (r) {
      if (r.status === 200 && r.ok) {
        closeDrawer();
        load().then(function () {
          say(r.note ? r.message : "Moved to " + col.title + ".", r.note ? "note" : true, r.undo);
          focusCard(r.id || i.id);
        });
      } else if (r.status === 409 || r.status === 404) {
        closeDrawer(); load(r.message || "This page changed - reloaded.");
      } else {
        load().then(function (ok) { if (ok) say(r.message || "That move did not work."); });
      }
    });
  }

  function focusCard(id) {
    var cards = document.querySelectorAll(".card");
    for (var k = 0; k < cards.length; k++) {
      if (cards[k].getAttribute("data-id") === id) { cards[k].focus(); cards[k].scrollIntoView({ block: "nearest" }); return; }
    }
  }

  function doUndo() {
    api("POST", "/api/undo", {}).then(function (r) {
      closeDrawer();
      load().then(function (ok) { if (ok) say(r.message || "Undo did not work.", r.ok ? (r.note ? "note" : true) : false); });
    });
  }

  function openThing(id, how) {
    api("POST", "/api/open", { id: id, how: how }).then(function (r) { say(r.message || "Could not open it.", r.ok); });
  }

  function copy(text) {
    function fallback() {
      var t = el("textarea", { "aria-hidden": "true" });
      t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      t.remove();
      say(ok ? "Prompt copied. Paste it into Claude." : "Could not copy. Select the text and copy it yourself.", ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { say("Prompt copied. Paste it into Claude.", true); }, fallback);
    } else fallback();
  }

  function openDrawer(i) {
    current = i; lastFocus = document.activeElement;
    var d = $("drawer");
    d.textContent = "";
    d.appendChild(el("button", { cls: "btn close", text: "Close", onclick: closeDrawer }));
    d.appendChild(el("h2", { id: "d-title", text: i.text || i.line }));
    d.appendChild(el("div", { cls: "line", text: i.line }));
    var who = i.mine ? "My to-do" : (i.owner === "theirs" ? "@" + i.person + " owes me" : "I owe @" + i.person);
    var dl = el("dl", {}, [
      el("dt", { text: "Page" }), el("dd", { text: i.page_title }),
      el("dt", { text: "File" }), el("dd", { text: i.page + " (line " + i.line_no + ")" }),
      el("dt", { text: "Person" }), el("dd", { text: who }),
      el("dt", { text: "Due" }), el("dd", { text: i.due ? niceDate(i.due) : "no date" })]);
    if (i.added) { dl.appendChild(el("dt", { text: "Added" })); dl.appendChild(el("dd", { text: niceDate(i.added) })); }
    d.appendChild(dl);
    var acts = el("div", { cls: "acts" }, [
      el("button", { cls: "btn primary", text: "Ask Claude", onclick: function () { openThing(i.id, "claude"); } }),
      el("button", { cls: "btn", text: "Copy prompt", onclick: function () { copy(i.prompt); } }),
      el("button", { cls: "btn", text: "Open in Obsidian", onclick: function () { openThing(i.id, "obsidian"); } }),
      el("button", { cls: "btn", text: "Open file", onclick: function () { openThing(i.id, "file"); } }),
      i.column === "done" ? null : el("button", { cls: "btn", text: "Mark done", onclick: function () { move(i, "done"); } }),
      el("button", { cls: "btn", text: "Undo last change", onclick: doUndo })]);
    d.appendChild(acts);
    var body = el("div", {}, [el("p", { cls: "empty", text: "Loading the page..." })]);
    d.appendChild(body);
    d.classList.add("open"); $("shade").classList.add("open");
    d.focus();
    api("GET", "/api/item?id=" + encodeURIComponent(i.id)).then(function (r) {
      if (current !== i) return;
      body.textContent = "";
      if (r.status !== 200) { body.appendChild(el("p", { text: r.message || "could not read the page." })); return; }
      body.appendChild(el("h3", { text: "The page" }));
      body.appendChild(el("pre", { text: r.page_text }));
      if (r.person_page) {
        body.appendChild(el("h3", { text: "The person (" + r.person_page + ")" }));
        body.appendChild(el("pre", { text: r.person_text }));
      }
    });
  }

  function closeDrawer() {
    if (!current) return;
    current = null;
    $("drawer").classList.remove("open"); $("shade").classList.remove("open");
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }

  function renderInbox() {
    var v = $("inbox-view"), ib = state.inbox;
    v.textContent = "";
    if (!ib) return;
    var groups = [
      ["desk", "Proposals on the sorting desk", "Where Claude suggests each imported note should go. Say 'open the sorting desk' in Claude to accept or change them.",
        function (r) { return "#" + r.n + " " + r.title + (r.where ? " - to " + r.where : "") + (r.type ? " (" + r.type + ")" : ""); }],
      ["notes", "Notes in inbox/", "Imported notes waiting for a home.", function (r) { return r.title; }],
      ["loose", "Loose notes", "Pages with no header. Tasks in them are not on the board until they get one.",
        function (r) { return r.title + (r.tasks ? " - " + r.tasks + " task line(s) not counted" : ""); }],
      ["unsaved", "Pages not saved yet", "Changed on this Mac but not yet saved to your backup. Say 'back up my cortex' in Claude.",
        function (r) { return r.title + " (" + r.status + ")"; }]];
    var total = 0;
    groups.forEach(function (g) {
      var rows = ib[g[0]] || [];
      if (g[0] === "unsaved" && !ib.git) return;
      total += rows.length;
      if (!rows.length) return;
      var s = el("section", {}, [el("h2", { text: g[1] + " (" + rows.length + ")" }), el("p", { cls: "why", text: g[2] })]);
      rows.forEach(function (r) {
        s.appendChild(el("div", { cls: "row" }, [
          el("div", { cls: "what" }, [el("span", { text: g[3](r) }), el("span", { cls: "path", text: r.rel })]),
          el("div", { cls: "acts" }, [
            el("button", { cls: "btn", text: "Open file", onclick: function () { openThing(r.id, "file"); } }),
            el("button", { cls: "btn primary", text: "Ask Claude", onclick: function () { openThing(r.id, "claude"); } }),
            el("button", { cls: "btn", text: "Copy prompt", onclick: function () { copy(r.prompt); } })])]));
      });
      v.appendChild(s);
    });
    if (!total) v.appendChild(el("section", {}, [el("h2", { text: "Your inbox is empty" }),
      el("p", { cls: "why", text: "Nothing is waiting to be filed or saved." })]));
    $("tab-inbox").textContent = "Inbox" + (total ? " (" + total + ")" : "");
  }

  function showTab(which) {
    var board = which === "board";
    $("tab-board").setAttribute("aria-selected", String(board));
    $("tab-inbox").setAttribute("aria-selected", String(!board));
    $("board-view").hidden = !board; $("inbox-view").hidden = board;
    $("f-area-l").hidden = !board; $("f-person-l").hidden = !board;
    try { localStorage.setItem("cortex-board-tab", which); } catch (e) {}
  }

  $("tab-board").addEventListener("click", function () { showTab("board"); });
  $("tab-inbox").addEventListener("click", function () { showTab("inbox"); });
  $("f-area").addEventListener("change", function (e) { filters.area = e.target.value; render(); });
  $("f-person").addEventListener("change", function (e) { filters.person = e.target.value; render(); });
  $("refresh").addEventListener("click", function () { load().then(function (ok) { if (ok) say("Up to date.", true); }); });
  $("undo").addEventListener("click", doUndo);
  $("shade").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDrawer();
    if (e.key !== "Tab" || !current) return;
    // Keep Tab inside the open drawer.
    var d = $("drawer"), f = d.querySelectorAll("button, select, [tabindex]:not([tabindex='-1'])");
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (!d.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && (document.activeElement === first || document.activeElement === d)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !current) load(); });
  try { if (localStorage.getItem("cortex-board-tab") === "inbox") showTab("inbox"); } catch (e) {}
  load();
})();
</script>
</body>
</html>
